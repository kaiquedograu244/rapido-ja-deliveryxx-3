<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ea1d2c">
  <title>RapidoJá Delivery</title>
  <meta name="description" content="Peça comida dos melhores restaurantes e acompanhe a entrega em tempo real.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <div class="container topo-conteudo">
      <a href="#/" class="logo" aria-label="RapidoJá - início">Rapido<span>Já</span></a>
      <nav class="menu" aria-label="Principal">
        <a href="#/">Restaurantes</a>
        <a href="#/pedidos" data-requer-login>Meus pedidos</a>
        <a href="#/admin" data-requer-admin hidden>Painel</a>
        <a href="#/perfil" data-requer-login id="link-perfil">Perfil</a>
        <a href="#/login" data-sem-login class="btn btn-contorno btn-pequeno">Entrar</a>
        <button type="button" class="btn btn-primario btn-pequeno" id="btn-carrinho" aria-label="Abrir carrinho">
          Carrinho <span class="badge" id="contador-carrinho">0</span>
        </button>
      </nav>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1" aria-live="polite"></main>

  <aside class="carrinho" id="carrinho" aria-label="Carrinho" aria-hidden="true">
    <div class="carrinho-topo">
      <h2>Seu carrinho</h2>
      <button type="button" class="btn-fechar" id="fechar-carrinho" aria-label="Fechar carrinho">&times;</button>
    </div>
    <div id="carrinho-conteudo" class="carrinho-conteudo"></div>
  </aside>
  <div class="sombra" id="sombra" hidden></div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <footer class="rodape">
    <div class="container">RapidoJá Delivery &middot; Front HTML/JS &middot; API Java (Spring Boot) &middot; API C# (.NET) &middot; MySQL</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/carrinho.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
